<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل سفارش</title>
    <style>
        /* استایل ساده */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #f5f7fa; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .section { background: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .messenger-card { background: white; border: 2px solid #ddd; padding: 20px; border-radius: 10px; margin: 15px 0; cursor: pointer; text-align: center; }
        .messenger-card.selected { border-color: #3498db; background: #e3f2fd; }
        .btn { display: block; width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 تکمیل سفارش</h1>
            <p id="statusMessage">در حال بررسی...</p>
        </div>

        <!-- بخش پیام‌رسان -->
        <div class="section" id="messengerSection" style="display: none;">
            <h2>📱 روش ارتباط را انتخاب کنید:</h2>
            
            <div class="messenger-card" onclick="selectMessenger('telegram')" id="telegramCard">
                <h3>📨 تلگرام</h3>
                <p>ارسال سفارش از طریق تلگرام</p>
            </div>
            
            <div class="messenger-card" onclick="selectMessenger('whatsapp')" id="whatsappCard">
                <h3>💬 واتساپ</h3>
                <p>ارسال سفارش از طریق واتساپ</p>
            </div>
            
            <button class="btn" id="sendButton" onclick="sendOrder()" disabled>
                ارسال سفارش
            </button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #3498db; text-decoration: none;">
                    ↩️ بازگشت به فروشگاه
                </a>
            </div>
        </div>

        <!-- پیام خالی بودن سبد -->
        <div class="section" id="emptyCartMessage" style="display: none;">
            <h2>🛒 سبد خرید خالی است</h2>
            <p>شما هنوز هیچ محصولی به سبد خرید اضافه نکرده‌اید.</p>
            <button class="btn" onclick="goToShop()">
                🏪 رفتن به فروشگاه
            </button>
        </div>
    </div>

    <script>
        const phoneNumber = "989965566964";
        let selectedMessenger = null;

        // تابع اصلی بررسی همه حالت‌های ممکن
        function checkAllPossibilities() {
            console.log("🔍 شروع بررسی localStorage...");
            
            // لیست تمام keyهای ممکن برای سبد خرید
            const possibleKeys = [
                'cart', 'shoppingCart', 'basket', 'سبدخرید', 
                'cartItems', 'userCart', 'products', 'items'
            ];
            
            let foundData = null;
            let foundKey = null;
            
            // جستجو در تمام keyهای ممکن
            possibleKeys.forEach(key => {
                const data = localStorage.getItem(key);
                if (data && data !== 'null' && data !== '[]' && data !== '{}') {
                    foundData = data;
                    foundKey = key;
                    console.log(`✅ داده در key '${key}' یافت شد:`, data.substring(0, 100));
                }
            });
            
            // اگر هیچ داده‌ای پیدا نشد، کل localStorage را بررسی کن
            if (!foundData) {
                console.log("🔎 جستجوی در تمام localStorage...");
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    
                    // اگر مقدار شبیه داده JSON است
                    if (value && (value.includes('{') || value.includes('['))) {
                        console.log(`📝 key پیدا شده: '${key}'`, value.substring(0, 100));
                        foundData = value;
                        foundKey = key;
                        break;
                    }
                }
            }
            
            // پردازش داده‌های پیدا شده
            if (foundData) {
                processFoundData(foundData, foundKey);
            } else {
                showEmptyCart();
            }
        }

        // پردازش داده‌های پیدا شده
        function processFoundData(data, key) {
            try {
                console.log(`🔄 پردازش داده‌های '${key}':`, data);
                
                const parsed = JSON.parse(data);
                let cartItems = [];
                
                // تشخیص ساختار داده
                if (Array.isArray(parsed)) {
                    console.log("📋 ساختار: آرایه");
                    cartItems = extractItemsFromArray(parsed);
                } 
                else if (typeof parsed === 'object') {
                    console.log("📋 ساختار: آبجکت");
                    cartItems = extractItemsFromObject(parsed);
                }
                
                if (cartItems.length > 0) {
                    console.log(`✅ ${cartItems.length} محصول پیدا شد:`, cartItems);
                    showMessengerSection(cartItems);
                } else {
                    console.log("⚠️ داده پیدا شد اما محصولی استخراج نشد");
                    showEmptyCart();
                }
                
            } catch (error) {
                console.error("❌ خطا در پردازش داده:", error);
                showEmptyCart();
            }
        }

        // استخراج آیتم‌ها از آرایه
        function extractItemsFromArray(arr) {
            const items = [];
            
            arr.forEach(item => {
                if (!item) return;
                
                // چندین حالت مختلف نام
                const name = item.name || item.title || item.productName || item.product || 'محصول';
                
                // چندین حالت مختلف قیمت
                const price = item.price || item.cost || item.productPrice || item.value || 0;
                
                // چندین حالت مختلف تعداد
                const quantity = item.quantity || item.count || item.qty || item.amount || 1;
                
                if (name && price > 0 && quantity > 0) {
                    items.push({
                        name: name,
                        price: Number(price),
                        quantity: Number(quantity)
                    });
                }
            });
            
            return items;
        }

        // استخراج آیتم‌ها از آبجکت
        function extractItemsFromObject(obj) {
            const items = [];
            
            // اگر خود آبجکت شامل فیلدهای محصول باشد
            if (obj.name || obj.title) {
                const name = obj.name || obj.title;
                const price = obj.price || obj.cost || 0;
                const quantity = obj.quantity || obj.count || 1;
                
                if (name && price > 0) {
                    items.push({ name, price: Number(price), quantity: Number(quantity) });
                }
            }
            
            // اگر آبجکت شامل آرایه‌ای از محصولات باشد
            if (obj.items && Array.isArray(obj.items)) {
                items.push(...extractItemsFromArray(obj.items));
            }
            if (obj.products && Array.isArray(obj.products)) {
                items.push(...extractItemsFromArray(obj.products));
            }
            if (obj.cart && Array.isArray(obj.cart)) {
                items.push(...extractItemsFromArray(obj.cart));
            }
            
            // اگر آبجکت شامل چندین محصول به صورت key-value باشد
            Object.keys(obj).forEach(key => {
                const item = obj[key];
                if (item && typeof item === 'object') {
                    const extracted = extractItemsFromObject(item);
                    if (extracted.length > 0) {
                        items.push(...extracted);
                    }
                }
            });
            
            return items;
        }

        // نمایش بخش پیام‌رسان
        function showMessengerSection(cartItems) {
            document.getElementById('messengerSection').style.display = 'block';
            document.getElementById('emptyCartMessage').style.display = 'none';
            document.getElementById('statusMessage').textContent = 
                `✅ ${cartItems.length} محصول در سبد خرید شما موجود است`;
            
            // ذخیره محصولات برای استفاده بعدی
            window.cartItems = cartItems;
        }

        // نمایش پیام خالی
        function showEmptyCart() {
            document.getElementById('messengerSection').style.display = 'none';
            document.getElementById('emptyCartMessage').style.display = 'block';
            document.getElementById('statusMessage').textContent = 'سبد خرید شما خالی است';
        }

        // انتخاب پیام‌رسان
        function selectMessenger(messenger) {
            selectedMessenger = messenger;
            document.getElementById('telegramCard').classList.remove('selected');
            document.getElementById('whatsappCard').classList.remove('selected');
            document.getElementById(messenger + 'Card').classList.add('selected');
            document.getElementById('sendButton').disabled = false;
        }

        // ارسال سفارش
        function sendOrder() {
            if (!selectedMessenger || !window.cartItems || window.cartItems.length === 0) {
                alert('لطفا ابتدا محصولاتی به سبد خرید اضافه کنید');
                return;
            }
            
            // ساخت پیام
            let message = `سلام! سفارش جدید:\n\n`;
            let total = 0;
            
            window.cartItems.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                message += `📦 ${item.name}\n`;
                message += `   تعداد: ${item.quantity}\n`;
                message += `   قیمت: ${itemTotal.toLocaleString('fa-IR')} تومان\n\n`;
            });
            
            message += `💰 جمع کل: ${total.toLocaleString('fa-IR')} تومان\n\n`;
            message += `لطفا راهنمایی کنید.`;
            
            // ساخت لینک
            const encodedMessage = encodeURIComponent(message);
            let url = '';
            
            if (selectedMessenger === 'telegram') {
                url = `https://t.me/+${phoneNumber}?text=${encodedMessage}`;
            } else {
                url = `https://wa.me/+${phoneNumber}?text=${encodedMessage}`;
            }
            
            // تغییر وضعیت دکمه
            const button = document.getElementById('sendButton');
            button.textContent = 'در حال انتقال...';
            button.disabled = true;
            
            // باز کردن لینک
            setTimeout(() => {
                window.open(url, '_blank');
                button.textContent = '✅ ارسال شد';
                setTimeout(() => {
                    button.textContent = 'ارسال مجدد';
                    button.disabled = false;
                }, 2000);
            }, 1000);
        }

        // رفتن به فروشگاه
        function goToShop() {
            window.location.href = 'index.html';
        }

        // اجرا هنگام بارگذاری
        document.addEventListener('DOMContentLoaded', function() {
            // ابتدا منتظر بمان تا مطمئن شویم همه چیز لود شده
            setTimeout(() => {
                checkAllPossibilities();
            }, 500);
        });

        // دکمه بازرسی در کنسول
        window.inspectCart = function() {
            console.clear();
            console.log("🕵️‍♂️ بازرسی localStorage:");
            console.log("کلیدهای موجود:", Object.keys(localStorage));
            
            Object.keys(localStorage).forEach(key => {
                console.log(`\n📁 Key: "${key}"`);
                try {
                    const value = localStorage.getItem(key);
                    console.log("مقدار:", value.substring(0, 200));
                    console.log("طول:", value.length);
                    console.log("نوع:", typeof value);
                    
                    // سعی در parse کردن
                    const parsed = JSON.parse(value);
                    console.log("✅ Parse موفق:", parsed);
                } catch(e) {
                    console.log("❌ Parse ناموفق - احتمالاً string ساده است");
                }
            });
            
            checkAllPossibilities();
        };
    </script>
</body>
</html>
