<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل سفارش</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #f5f7fa; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        
        /* خلاصه سفارش */
        .order-summary {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-right: 5px solid #3498db;
            display: none; /* ابتدا مخفی */
        }
        
        .order-items {
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        
        .order-total {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 2px solid #3498db;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .total-price {
            color: #27ae60;
        }
        
        /* بخش پیام‌رسان */
        .section { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
        }
        
        .messenger-card { 
            background: white; 
            border: 2px solid #ddd; 
            padding: 20px; 
            border-radius: 10px; 
            margin: 15px 0; 
            cursor: pointer; 
            text-align: center; 
        }
        
        .messenger-card.selected { 
            border-color: #3498db; 
            background: #e3f2fd; 
        }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            margin-top: 20px; 
            cursor: pointer; 
        }
        
        .btn:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 تکمیل سفارش</h1>
            <p id="statusMessage">در حال بررسی...</p>
        </div>
        
        <!-- خلاصه سفارش -->
        <div class="order-summary" id="orderSummary">
            <h2>📋 خلاصه سفارش</h2>
            <div class="order-items" id="orderItems">
                <!-- محصولات اینجا نمایش داده می‌شوند -->
            </div>
            <div class="order-total">
                <span>جمع کل:</span>
                <span class="total-price" id="totalPrice">۰ تومان</span>
            </div>
        </div>

        <!-- بخش پیام‌رسان -->
        <div class="section" id="messengerSection" style="display: none;">
            <h2>📱 روش ارتباط را انتخاب کنید:</h2>
            
            <div class="messenger-card" onclick="selectMessenger('telegram')" id="telegramCard">
                <h3>📨 تلگرام</h3>
                <p>ارسال سفارش از طریق تلگرام</p>
            </div>
            
            <div class="messenger-card" onclick="selectMessenger('whatsapp')" id="whatsappCard">
                <h3>💬 واتساپ</h3>
                <p>ارسال سفارش از طریق واتساپ</p>
            </div>
            
            <button class="btn" id="sendButton" onclick="sendOrder()" disabled>
                ارسال سفارش
            </button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #3498db; text-decoration: none;">
                    ↩️ بازگشت به فروشگاه
                </a>
            </div>
        </div>

        <!-- پیام خالی بودن سبد -->
        <div class="section" id="emptyCartMessage" style="display: none;">
            <h2>🛒 سبد خرید خالی است</h2>
            <p>شما هنوز هیچ محصولی به سبد خرید اضافه نکرده‌اید.</p>
            <button class="btn" onclick="goToShop()">
                🏪 رفتن به فروشگاه
            </button>
        </div>
    </div>

    <script>
        const TELEGRAM_ID = "PG_supporter";
        const WHATSAPP_NUMBER = "989965566964";
        
        let selectedMessenger = null;
        let cartItems = [];

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                checkAllPossibilities();
            }, 500);
        });

        function checkAllPossibilities() {
            console.log("🔍 بررسی سبد خرید...");
            
            const possibleKeys = ['cart', 'shoppingCart', 'basket', 'سبدخرید', 'cartItems'];
            let foundData = null;
            let foundKey = null;
            
            possibleKeys.forEach(key => {
                const data = localStorage.getItem(key);
                if (data && data !== 'null' && data !== '[]' && data !== '{}') {
                    foundData = data;
                    foundKey = key;
                }
            });
            
            if (!foundData) {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    if (value && (value.includes('{') || value.includes('['))) {
                        foundData = value;
                        foundKey = key;
                        break;
                    }
                }
            }
            
            if (foundData) {
                processFoundData(foundData, foundKey);
            } else {
                showEmptyCart();
            }
        }

        function processFoundData(data, key) {
            try {
                const parsed = JSON.parse(data);
                cartItems = [];
                
                if (Array.isArray(parsed)) {
                    cartItems = extractItemsFromArray(parsed);
                } else if (typeof parsed === 'object') {
                    cartItems = extractItemsFromObject(parsed);
                }
                
                if (cartItems.length > 0) {
                    showOrderSummary(); // نمایش خلاصه سفارش
                    showMessengerSection();
                } else {
                    showEmptyCart();
                }
                
            } catch (error) {
                console.error("خطا در پردازش داده:", error);
                showEmptyCart();
            }
        }

        // نمایش خلاصه سفارش
        function showOrderSummary() {
            const orderItemsDiv = document.getElementById('orderItems');
            const orderSummaryDiv = document.getElementById('orderSummary');
            const totalPriceDiv = document.getElementById('totalPrice');
            
            // پاک کردن محتوای قبلی
            orderItemsDiv.innerHTML = '';
            
            let total = 0;
            
            // نمایش هر محصول
            cartItems.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'order-item';
                itemDiv.innerHTML = `
                    <div>
                        <strong>${item.name}</strong>
                        <div style="font-size: 0.9rem; color: #666;">تعداد: ${item.quantity}</div>
                    </div>
                    <div>${itemTotal.toLocaleString('fa-IR')} تومان</div>
                `;
                orderItemsDiv.appendChild(itemDiv);
            });
            
            // نمایش جمع کل
            totalPriceDiv.textContent = total.toLocaleString('fa-IR') + ' تومان';
            
            // نمایش بخش خلاصه سفارش
            orderSummaryDiv.style.display = 'block';
        }

        function extractItemsFromArray(arr) {
            const items = [];
            arr.forEach(item => {
                if (!item) return;
                const name = item.name || item.title || item.productName || item.product || 'محصول';
                const price = item.price || item.cost || item.productPrice || item.value || 0;
                const quantity = item.quantity || item.count || item.qty || item.amount || 1;
                
                if (name && price > 0 && quantity > 0) {
                    items.push({
                        name: name,
                        price: Number(price),
                        quantity: Number(quantity)
                    });
                }
            });
            return items;
        }

        function extractItemsFromObject(obj) {
            const items = [];
            
            if (obj.name || obj.title) {
                const name = obj.name || obj.title;
                const price = obj.price || obj.cost || 0;
                const quantity = obj.quantity || obj.count || 1;
                if (name && price > 0) {
                    items.push({ name, price: Number(price), quantity: Number(quantity) });
                }
            }
            
            if (obj.items && Array.isArray(obj.items)) {
                items.push(...extractItemsFromArray(obj.items));
            }
            if (obj.products && Array.isArray(obj.products)) {
                items.push(...extractItemsFromArray(obj.products));
            }
            
            return items;
        }

        function showMessengerSection() {
            document.getElementById('messengerSection').style.display = 'block';
            document.getElementById('emptyCartMessage').style.display = 'none';
            document.getElementById('statusMessage').textContent = 
                `✅ ${cartItems.length} محصول در سبد خرید`;
        }

        function showEmptyCart() {
            document.getElementById('messengerSection').style.display = 'none';
            document.getElementById('orderSummary').style.display = 'none';
            document.getElementById('emptyCartMessage').style.display = 'block';
            document.getElementById('statusMessage').textContent = 'سبد خرید شما خالی است';
        }

        function selectMessenger(messenger) {
            selectedMessenger = messenger;
            document.getElementById('telegramCard').classList.remove('selected');
            document.getElementById('whatsappCard').classList.remove('selected');
            document.getElementById(messenger + 'Card').classList.add('selected');
            document.getElementById('sendButton').disabled = false;
        }

        function sendOrder() {
            if (!selectedMessenger || cartItems.length === 0) {
                alert('لطفا ابتدا محصولاتی به سبد خرید اضافه کنید');
                return;
            }
            
            let message = `سلام! سفارش جدید:\n\n`;
            let total = 0;
            
            cartItems.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                message += `📦 ${item.name}\n`;
                message += `   تعداد: ${item.quantity}\n`;
                message += `   قیمت: ${itemTotal.toLocaleString('fa-IR')} تومان\n\n`;
            });
            
            message += `💰 جمع کل: ${total.toLocaleString('fa-IR')} تومان\n\n`;
            message += `لطفا راهنمایی کنید.`;
            
            const encodedMessage = encodeURIComponent(message);
            let url = '';
            
            if (selectedMessenger === 'telegram') {
                url = `https://t.me/${TELEGRAM_ID}?text=${encodedMessage}`;
            } else {
                url = `https://wa.me/+${WHATSAPP_NUMBER}?text=${encodedMessage}`;
            }
            
            const button = document.getElementById('sendButton');
            button.textContent = 'در حال انتقال...';
            button.disabled = true;
            
            setTimeout(() => {
                window.open(url, '_blank');
                button.textContent = '✅ ارسال شد';
                setTimeout(() => {
                    button.textContent = 'ارسال مجدد';
                    button.disabled = false;
                }, 2000);
            }, 1000);
        }

        function goToShop() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
