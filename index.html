    <div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>

    <script>
        // ==================== توابع سبد خرید (مستقل) ====================
        function openCart() {
            document.getElementById('cartSidebar').classList.add('active');
            document.getElementById('cartOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeCart() {
            document.getElementById('cartSidebar').classList.remove('active');
            document.getElementById('cartOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        function updateCartCount() {
            try {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
                const cartCount = document.getElementById('cartCount');
                if (cartCount) cartCount.textContent = totalItems;
                const totalItemsSpan = document.getElementById('totalItems');
                if (totalItemsSpan) totalItemsSpan.textContent = totalItems;
            } catch(e) {}
        }
        
        function addToCart(productId) {
            if (typeof window.addToCartOriginal === 'function') {
                window.addToCartOriginal(productId);
            } else {
                const product = products.find(p => p.id === productId);
                if (product) {
                    let cart = JSON.parse(localStorage.getItem('cart')) || [];
                    const existing = cart.find(item => item.id === productId);
                    if (existing) {
                        existing.quantity += 1;
                    } else {
                        cart.push({
                            id: product.id,
                            name: product.name,
                            price: product.price,
                            priceText: product.priceText || product.price,
                            image: product.image,
                            quantity: 1
                        });
                    }
                    localStorage.setItem('cart', JSON.stringify(cart));
                    updateCartCount();
                    showNotification(product.name + ' به سبد خرید اضافه شد', 'success');
                }
            }
        }
        
        function showNotification(message, type) {
            const notif = document.createElement('div');
            notif.className = 'notification ' + type;
            notif.innerHTML = '<span>' + message + '</span>';
            notif.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#00C9B1;color:white;padding:12px 24px;border-radius:8px;z-index:9999;';
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2500);
        }
        
        // بروزرسانی اولیه
        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
            setInterval(updateCartCount, 3000);
        });
        
        // اتصال به تابع اصلی اگه وجود داشت
        if (typeof window.originalAddToCart === 'undefined' && typeof addToCart !== 'undefined') {
            window.addToCartOriginal = addToCart;
        }
    </script>
