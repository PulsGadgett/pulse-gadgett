    <!-- سایدبار سبد خرید -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3 class="cart-title">🛒 سبد خرید شما</h3>
            <button class="close-cart" id="closeCartButton">✕</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">

                <strong>تعداد کل: <span id="totalItems">0</span> محصول</strong>
            </div>
            <button class="checkout-btn" id="checkoutButton">📦 ثبت سفارش</button>
        </div>
    </div>
    <div id="cartOverlay" class="cart-overlay"></div>

    <script>
        // ==================== سبد خرید با متد ساده ====================
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        
        // توابع باز و بسته کردن سایدبار
        function openCart() {
            document.getElementById('cartSidebar').classList.add('show');
            document.getElementById('cartOverlay').classList.add('show');
        }
        
        function closeCart() {
            document.getElementById('cartSidebar').classList.remove('show');
            document.getElementById('cartOverlay').classList.remove('show');
        }
        
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }
        
        function updateCartUI() {
            const totalItems = cart.reduce((sum, i) => sum + i.quantity, 0);
            const cartCount = document.getElementById('cartCount');
            const totalItemsSpan = document.getElementById('totalItems');
            if (cartCount) cartCount.innerText = totalItems;
            if (totalItemsSpan) totalItemsSpan.innerText = totalItems;
            
            const container = document.getElementById('cartItems');
            if (!container) return;
            
            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;">🛒 سبد خرید خالی است</div>';
                return;
            }
            
            container.innerHTML = cart.map(item => {
                const priceNum = parseInt(String(item.price).replace(/[^0-9]/g, '')) || 0;
                const total = (priceNum * item.quantity).toLocaleString('fa-IR');
                return `
                    <div class="cart-item">
                        <div><strong>${item.name}</strong></div>
                        <div>قیمت: ${item.priceText || item.price}</div>
                        <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                            <button onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQty(${item.id}, 1)">+</button>
                            <button onclick="removeFromCart(${item.id})" style="color:red;">🗑️</button>
                        </div>
                        <div>جمع: ${total} تومان</div>
                    </div>
                `;
            }).join('');
        }
        
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    priceText: product.priceText || product.price,
                    image: product.image,
                    quantity: 1
                });
            }
            saveCart();
            showNotif(`${product.name} به سبد خرید اضافه شد`);
        }
        
        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                saveCart();
            }
        }
        
        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            showNotif('محصول حذف شد');
        }
        
        function showNotif(msg) {
            let n = document.createElement('div');
            n.innerText = msg;
            n.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#00C9B1;color:white;padding:12px 20px;border-radius:8px;z-index:9999;';
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 2000);
        }
        
        function searchProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term) || (p.code && p.code.toLowerCase().includes(term)));
            displayProducts(filtered);
        }
        
        function displayProducts(arr) {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            grid.innerHTML = arr.map(p => `
                <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
                    <div class="product-image"><img src="${p.image || ''}" onerror="this.src='images/placeholder.jpg'"></div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="product-price">${p.priceText || p.price}</div>
                        <div class="product-code">کد: ${p.code}</div>
                        <button class="add-to-cart-btn" onclick="event.stopPropagation(); addToCart(${p.id})">🛒 افزودن</button>
                    </div>
                </div>
            `).join('');
        }
        
        function createCategoryButtons() {
            const cats = ['همه', ...new Set(products.map(p => p.category))];
            const container = document.getElementById('category-buttons');
            if (!container) return;
            container.innerHTML = cats.map(cat => `<button class="category-btn" data-cat="${cat}">${cat}</button>`).join('');
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.onclick = () => {
                    const cat = btn.dataset.cat;
                    if (cat === 'همه') displayProducts(products);
                    else displayProducts(products.filter(p => p.category === cat));
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
            });
            document.querySelector('.category-btn')?.classList.add('active');
        }
        
        // اتصال رویدادها
        document.getElementById('cartIcon')?.addEventListener('click', openCart);
        document.getElementById('closeCartButton')?.addEventListener('click', closeCart);
        document.getElementById('cartOverlay')?.addEventListener('click', closeCart);
        document.getElementById('searchButton')?.addEventListener('click', searchProducts);
        document.getElementById('searchInput')?.addEventListener('keypress', e => { if(e.key === 'Enter') searchProducts(); });
        document.getElementById('checkoutButton')?.addEventListener('click', () => {
            if(cart.length === 0) return showNotif('سبد خرید خالی است');
            let msg = encodeURIComponent('سفارش جدید:\n' + cart.map(i => `${i.name} × ${i.quantity}`).join('\n'));
            window.open(`https://wa.me/989965566964?text=${msg}`, '_blank');
            closeCart();
        });
        
        createCategoryButtons();
        displayProducts(products);
        updateCartUI();
        
        console.log('✅ سایت آماده است - سبد خرید با کلیک روی آیکون باز میشود');
    </script>
