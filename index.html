    // اتصال دستی دکمه سبد خرید
    document.addEventListener('DOMContentLoaded', function() {
        var cartBtn = document.getElementById('cartIcon');
        var sidebar = document.getElementById('cartSidebar');
        var overlay = document.getElementById('cartOverlay');
        var closeBtn = document.getElementById('closeCartButton');
        
        function openCart() {
            if (sidebar) sidebar.classList.add('active');
            if (overlay) overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeCart() {
            if (sidebar) sidebar.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        if (cartBtn) cartBtn.addEventListener('click', openCart);
        if (closeBtn) closeBtn.addEventListener('click', closeCart);
        if (overlay) overlay.addEventListener('click', closeCart);
        
        console.log('🔧 دکمه سبد خرید متصل شد');
    });
</script>
<script>
    // اتصال مستقیم سبد خرید با متد دستی
    (function() {
        const cartBtn = document.getElementById('cartIcon');
        const cartSidebar = document.getElementById('cartSidebar');
        const cartOverlay = document.getElementById('cartOverlay');
        const closeCartBtn = document.getElementById('closeCartButton');
        
        // تابع باز کردن - مستقیم مثل کاری که در کنسول جواب داد
        function openCart() {
            cartSidebar.classList.add('active');
            cartOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        // تابع بستن
        function closeCart() {
            cartSidebar.classList.remove('active');
            cartOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // حذف هرگونه رویداد قبلی و اتصال جدید
        if (cartBtn) {
            const newBtn = cartBtn.cloneNode(true);
            cartBtn.parentNode.replaceChild(newBtn, cartBtn);
            newBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                openCart();
            });
        }
        
        if (closeCartBtn) {
            closeCartBtn.addEventListener('click', closeCart);
        }
        
        if (cartOverlay) {
            cartOverlay.addEventListener('click', closeCart);
        }
        
        // تست نهایی
        console.log('🔗 سبد خرید با روش جدید متصل شد');
    })();
</script>
