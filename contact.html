<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما - PulseGadgett</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <header class="site-header">
        <!-- هدر اصلی -->
    </header>

    <main class="container content-page">
        <div class="content-header" data-animate="fade-up">
            <h1 data-typewriter>📞 تماس با ما</h1>
            <p class="content-subtitle">آماده پاسخگویی به سوالات شما هستیم</p>
        </div>

        <div class="grid-2-col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;">
            <!-- فرم تماس -->
            <div class="content-card" data-animate="fade-right">
                <h2>پیام بفرستید</h2>
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">نام کامل</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="email">ایمیل</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">شماره تماس</label>
                        <input type="tel" id="phone" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="message">پیام شما</label>
                        <textarea id="message" class="form-control" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn btn-ripple">
                        📨 ارسال پیام
                    </button>
                </form>
            </div>

            <!-- اطلاعات تماس -->
            <div class="content-card" data-animate="fade-left">
                <h2>اطلاعات تماس</h2>
                <div class="contact-info">
                    <div class="contact-item" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: #f8f8f8; border-radius: 12px; transition: all 0.3s ease;">
                        <div class="contact-icon" style="width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                            📍
                        </div>
                        <div>
                            <h3 style="margin: 0 0 0.3rem 0;">آدرس</h3>
                            <p style="margin: 0; color: #666;">تهران، خیابان ولیعصر، پلاک ۱۲۳</p>
                        </div>
                    </div>
                    
                    <div class="contact-item" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: #f8f8f8; border-radius: 12px; transition: all 0.3s ease;">
                        <div class="contact-icon" style="width: 50px; height: 50px; background: var(--secondary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                            📱
                        </div>
                        <div>
                            <h3 style="margin: 0 0 0.3rem 0;">تلفن</h3>
                            <p style="margin: 0; color: #666;">۰۲۱-۱۲۳۴۵۶۷۸</p>
                        </div>
                    </div>
                </div>

                <table class="info-table">
                    <thead>
                        <tr>
                            <th>روز</th>
                            <th>ساعات کاری</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>شنبه تا چهارشنبه</td>
                            <td>۸:۰۰ - ۱۷:۰۰</td>
                        </tr>
                        <tr>
                            <td>پنج‌شنبه</td>
                            <td>۸:۰۰ - ۱۴:۰۰</td>
                        </tr>
                        <tr>
                            <td>جمعه</td>
                            <td>تعطیل</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- پشتیبانی و فوتر -->

    <script src="common.js"></script>
    <script>
        // مدیریت فرم تماس
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = this.querySelector('.submit-btn');
            submitBtn.classList.add('submitting');
            
            // شبیه‌سازی ارسال
            setTimeout(() => {
                PulseAnimations.showNotification('پیام شما با موفقیت ارسال شد!', 'success');
                submitBtn.classList.remove('submitting');
                submitBtn.innerHTML = '📨 ارسال پیام';
                this.reset();
            }, 2000);
        });
    </script>
</body>
</html>
