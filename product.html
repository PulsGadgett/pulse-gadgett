<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseGadgett - جزئیات محصول</title>
    <link rel="stylesheet" href="style.css">
    <script src="products-data.js"></script>
    <script src="script.js" defer></script>
    
    <style>
        /* استایل‌های مخصوص صفحه محصول - در صورت نیاز به فایل style.css منتقل شوند */
        .image-zoom-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: zoom-out;
        }

        .zoomed-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .close-zoom {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-category-badge {
            display: inline-block;
            background: var(--category-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .spec-item:last-child {
            border-bottom: none;
        }

        .spec-label {
            font-weight: bold;
            color: var(--text-dark);
            font-size: 1rem;
        }

        .spec-value {
            color: #666;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="brand">
                <div class="logo-container">
                    <a href="index.html" style="display: contents;">
                        <img src="images/logo.jpg" alt="PulseGadgett" class="logo">
                        <div class="brand-text">
                            <h1>PulseGadgett</h1>
                            <p>ضربان استایل دیجیتال شما</p>
                        </div>
                    </a>
                </div>
            </div>
            
            <div class="header-actions">
                <div class="cart-icon" id="cartIcon">
                    🛒 سبد خرید
                    <span id="cartCount" class="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="productDetail">
            <!-- محصول اینجا نمایش داده می‌شود -->
        </div>
        
        <div class="back-button">
            <button onclick="window.location.href='index.html'">← بازگشت به فروشگاه</button>
        </div>
    </main>

    <!-- سبد خرید -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>🛒 سبد خرید شما</h3>
            <button class="close-cart" id="closeCartButton">✕</button>
        </div>
        <div id="cartItems" class="cart-items">
            <!-- محصولات اینجا نمایش داده می‌شوند -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <strong>تعداد کل: <span id="totalItems">0</span> محصول</strong>
            </div>
            <button class="checkout-btn" id="checkoutButton">📦 ثبت سفارش</button>
        </div>
    </div>
    
    <div id="cartOverlay" class="cart-overlay"></div>

    <!-- کانتینر برای زوم عکس -->
    <div id="imageZoomContainer" class="image-zoom-container">
        <span class="close-zoom" onclick="closeZoom()">×</span>
        <img id="zoomedImage" class="zoomed-image" src="" alt="">
    </div>

    <!-- بخش پشتیبانی -->
    <section class="support-section">
        <div class="container">
            <h3>📞 پشتیبانی آنلاین</h3>
            <p>برای مشاوره و خرید با ما در ارتباط باشید</p>
            <div class="support-buttons">
                <a href="https://t.me/PG_supporter" class="support-btn telegram" target="_blank" rel="noopener noreferrer">
                    ✈️ تلگرام
                </a>
                <a href="https://wa.me/+989965566964" class="support-btn whatsapp" target="_blank" rel="noopener noreferrer">
                    💬 واتساپ
                </a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© PulseGadgett - ضربان استایل دیجیتال شما</p>
        </div>
    </footer>

    <script>
        // تابع برای نمایش جزئیات محصول
        function displayProductDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            
            let product = null;
            if (products && products.length > 0) {
                product = products.find(p => p.id === productId);
            }
            
            const productDetail = document.getElementById('productDetail');
            if (!productDetail) return;
            
            if (product) {
                productDetail.innerHTML = `
                    <div class="product-detail">
                        <div class="product-images">
                            <img src="${product.image}" alt="${product.name}" class="main-image" 
                                 onclick="openZoom('${product.image}')"
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjUwMCIgdmlld0JveD0iMCAwIDYwMCA1MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjYwMCIgaGVpZ2h0PSI1MDAiIGZpbGw9IiNGM0YzRjMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE2IiBmaWxsPSIjOTk5IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5تصویر محصول</dGV4dD48L3N2Zz4='">
                            <p style="margin-top: 10px; color: #666; font-size: 0.9rem;">
                                برای مشاهده عکس در سایز واقعی کلیک کنید
                            </p>
                        </div>
                        <div class="product-info">
                            <span class="product-category-badge">${product.category}</span>
                            <h1 class="product-title">${product.name}</h1>
                            <p class="product-description-full">${product.description}</p>
                            
                            <div class="product-specs">
                                <div class="spec-item">
                                    <span class="spec-label">کد محصول:</span>
                                    <span class="spec-value">${product.code}</span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">دسته‌بندی:</span>
                                    <span class="spec-value">${product.category}</span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">وضعیت موجودی:</span>
                                    <span class="spec-value">
                                        <span class="product-availability ${product.available ? 'in-stock' : 'out-of-stock'}">
                                            ${product.available ? '✅ موجود در انبار' : '❌ ناموجود'}
                                        </span>
                                    </span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">گارانتی:</span>
                                    <span class="spec-value">${product.description.includes('گارانتی') ? 
                                        product.description.split('|').find(part => part.includes('گارانتی')) || 'اطلاعات گارانتی' : 
                                        'اطلاعات گارانتی موجود نیست'}</span>
                                </div>
                            </div>
                            
                            <div class="product-price-section">
                                <span class="price">${product.price}</span>
                                ${product.available ? 
                                    `<button class="add-to-cart" id="addToCartButton" data-product-id="${product.id}">
                                        ➕ افزودن به سبد خرید
                                    </button>` : 
                                    '<button class="out-of-stock-btn" disabled>ناموجود</button>'
                                }
                            </div>
                        </div>
                    </div>
                `;
                
                // آپدیت title صفحه
                document.title = `${product.name} - PulseGadgett`;
                
                // اضافه کردن event listener به دکمه افزودن به سبد خرید
                const addButton = document.getElementById('addToCartButton');
                if (addButton) {
                    addButton.addEventListener('click', function() {
                        const productId = parseInt(this.getAttribute('data-product-id'));
                        addToCart(productId);
                    });
                }
                
            } else {
                productDetail.innerHTML = `
                    <div class="error-message">
                        <h2>محصول یافت نشد</h2>
                        <p>متأسفانه محصول مورد نظر پیدا نشد.</p>
                        <p style="margin-top: 20px;">
                            <button onclick="window.location.href='index.html'" 
                                    style="background: var(--button-orange); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                                بازگشت به فروشگاه
                            </button>
                        </p>
                    </div>
                `;
            }
        }

        // تابع برای باز کردن عکس در سایز واقعی
        function openZoom(imageSrc) {
            const zoomContainer = document.getElementById('imageZoomContainer');
            const zoomedImage = document.getElementById('zoomedImage');
            
            if (zoomContainer && zoomedImage) {
                zoomedImage.src = imageSrc;
                zoomContainer.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        // تابع برای بستن زوم
        function closeZoom() {
            const zoomContainer = document.getElementById('imageZoomContainer');
            if (zoomContainer) {
                zoomContainer.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        // مقداردهی اولیه Event Listeners برای این صفحه
        function initializeProductPage() {
            // بستن زوم با کلیک روی background
            const zoomContainer = document.getElementById('imageZoomContainer');
            if (zoomContainer) {
                zoomContainer.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeZoom();
                    }
                });
            }

            // بستن با کلید ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeZoom();
                }
            });

            // سبد خرید
            const cartIcon = document.getElementById('cartIcon');
            const closeCartButton = document.getElementById('closeCartButton');
            const checkoutButton = document.getElementById('checkoutButton');
            const cartOverlay = document.getElementById('cartOverlay');

            if (cartIcon) cartIcon.addEventListener('click', toggleCart);
            if (closeCartButton) closeCartButton.addEventListener('click', toggleCart);
            if (checkoutButton) checkoutButton.addEventListener('click', checkout);
            if (cartOverlay) cartOverlay.addEventListener('click', toggleCart);
            
            // نمایش محصول
            displayProductDetails();
        }

        // بارگذاری اولیه
        document.addEventListener('DOMContentLoaded', function() {
            updateCartDisplay();
            initializeProductPage();
        });
    </script>
</body>
</html>
