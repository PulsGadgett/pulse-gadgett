<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصول - PulseGadgett</title>
    <script src="products-data.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .product-detail-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
            background: #f8f8f8;
            border-radius: 16px;
        }
        .product-detail-title {
            font-size: 2rem;
            color: var(--text);
            margin-bottom: 1rem;
        }
        .product-detail-price {
            font-size: 2rem;
            color: var(--primary);
            font-weight: bold;
            margin: 1rem 0;
        }
        .product-detail-code {
            color: #666;
            margin-bottom: 1rem;
        }
        .product-detail-desc {
            line-height: 1.8;
            color: #555;
            margin: 1.5rem 0;
        }
        .add-to-cart-detail {
            background: linear-gradient(135deg, #FF6B4A, #ff8b6b);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        .back-button {
            margin: 2rem 0;
            text-align: center;
        }
        .back-button button {
            background: #00C9B1;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            cursor: pointer;
        }
        .cart-sidebar, .cart-overlay {
            display: none;
        }
        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

            <div class="brand">
                <a href="index.html" style="text-decoration: none;">
                    <div class="logo-container">
                        <img src="images/logo.jpg" alt="PulseGadgett" class="logo"

                        <div class="brand-text">
                            <h1 class="site-title">PulseGadgett</h1>
                            <p class="site-tagline">ضربان استایل دیجیتال شما</p>
                        </div>
                    </div>
                </a>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">🏠 خانه</a>
                <a href="about.html" class="nav-link">ℹ️ درباره ما</a>
                <a href="contact.html" class="nav-link">📞 ارتباط</a>
                <a href="faq.html" class="nav-link">❓ سوالات</a>
            </nav>
            <div class="header-actions">
                <button class="cart-button" id="cartIcon" onclick="window.location.href='index.html'">
                    🛒 سبد خرید

                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="productDetail"></div>
        <div class="back-button">
            <button onclick="window.location.href='index.html'">← بازگشت به فروشگاه</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-container">
            <p class="footer-text">© PulseGadgett - ضربان استایل دیجیتال شما</p>
        </div>
    </footer>

    <script>
        // نمایش جزئیات محصول
        function showProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            
            if (!products || products.length === 0) {
                document.getElementById('productDetail').innerHTML = '<p>خطا در بارگذاری محصول</p>';
                return;
            }
            
            const product = products.find(p => p.id === productId);
            const container = document.getElementById('productDetail');
            
            if (!product) {
                container.innerHTML = '<p>محصول یافت نشد</p>';
                return;
            }
            
            const price = product.priceText || product.price;
            const brand = product.brand || (product.description ? product.description.split('|')[0] : '');
            
            container.innerHTML = `
                <div class="product-detail-container">
                    <div>
                        <img src="${product.image || 'images/placeholder.jpg'}" alt="${product.name}" class="product-detail-image"
                             onerror="this.src='images/placeholder.jpg'">
                    </div>
                    <div>
                        <h1 class="product-detail-title">${product.name}</h1>
                        ${brand ? '<div style="color:#00C9B1; margin-bottom:0.5rem;">🏷️ ' + brand + '</div>' : ''}
                        <div class="product-detail-code">کد محصول: ${product.code}</div>
                        <div style="color:#666; margin:0.5rem 0;">دسته: ${product.category}</div>
                        <div class="product-detail-price">${price}</div>
                        <div class="product-detail-desc">${product.description || 'توضیحاتی برای این محصول موجود نیست.'}</div>
                        <button class="add-to-cart-detail" onclick="addToCartAndRedirect(${product.id})">
                            🛒 افزودن به سبد خرید
                        </button>
                    </div>
                </div>
            `;
            
            document.title = `${product.name} - PulseGadgett`;
            
            // بروزرسانی تعداد سبد خرید
            updateCartCount();
        }
        
        function addToCartAndRedirect(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    priceText: product.priceText || product.price,
                    image: product.image,
                    quantity: 1
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(`${product.name} به سبد خرید اضافه شد`);
            window.location.href = 'index.html';
        }
        
        function updateCartCount() {
            try {
                const cart = JSON.parse(localStorage.getItem('cart') || '[]');
                const total = cart.reduce((sum, i) => sum + i.quantity, 0);
                const cartCount = document.getElementById('cartCount');
                if (cartCount) cartCount.innerText = total;
            } catch(e) {}
        }
        
        showProductDetail();
        updateCartCount();
        
        // هر 3 ثانیه یکبار آپدیت کن
        setInterval(updateCartCount, 3000);
    </script>
<footer class="site-footer">
    <div class="container footer-container">
        <p class="footer-text">© PulseGadgett - ضربان استایل دیجیتال شما</p>
        <p style="font-size: 0.8rem; text-align: center; margin-top: 0.5rem; opacity: 0.8;">
            طراحی و توسعه توسط <strong>نکسیو تیم</strong>
        </p>

</footer>    
</body>
</html>
