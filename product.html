<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصول - PulseGadgett</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="common.css">
    <script src="products-data.js"></script>
    <script src="script.js" defer></script>
    <style>
        .product-detail-page {
            padding: 3rem 0;
            min-height: 70vh;
        }
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .product-image-main {
            width: 100%;
            height: 400px;
            object-fit: contain;
            background: #f8f8f8;
            border-radius: 16px;
            cursor: pointer;
        }
        .product-title-detail {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text);
        }
        .product-price-detail {
            font-size: 2rem;
            color: var(--primary);
            font-weight: bold;
            margin: 1rem 0;
        }
        .product-code-detail {
            color: #666;
            margin-bottom: 1rem;
        }
        .product-description-detail {
            line-height: 1.8;
            color: #555;
            margin: 1.5rem 0;
        }
        .add-to-cart-detail {
            background: linear-gradient(135deg, var(--primary), #ff8b6b);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        .back-button {
            margin-top: 2rem;
            text-align: center;
        }
        .back-button button {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <div class="brand">
                <a href="index.html" style="text-decoration: none;">
                    <div class="logo-container">
                        <img src="images/logo.jpg" alt="PulseGadgett" class="logo" 
                             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHJ4PSIxMCIgZmlsbD0iIzg0NkNGOSIvPjxwYXRoIGQ9Ik0zMCAzNS41QzMzLjAzNzYgMzUuNSAzNS41IDMzLjAzNzYgMzUuNSAzMEMzNS41IDI2Ljk2MjQgMzMuMDM3NiAyNC41IDMwIDI0LjVDMjYuOTYyNCAyNC41IDI0LjUgMjYuOTYyNCAyNC41IDMwQzI0LjUgMzMuMDM3NiAyNi45NjI0IDM1LjUgMzAgMzUuNVoiIGZpbGw9IndoaXRlIi8+PHBhdGggZD0iTTIwIDQwTDQwIDMwTDM1IDIwSDE1TDIwIDQwWiIgZmlsbD0id2hpdGUiLz48L3N2Zz4=';">
                        <div class="brand-text">
                            <h1 class="site-title">PulseGadgett</h1>
                            <p class="site-tagline">ضربان استایل دیجیتال شما</p>
                        </div>
                    </div>
                </a>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">🏠 خانه</a>
                <a href="about.html" class="nav-link">ℹ️ درباره ما</a>
                <a href="contact.html" class="nav-link">📞 ارتباط</a>
                <a href="faq.html" class="nav-link">❓ سوالات</a>
            </nav>
            <div class="header-actions">
                <button class="cart-button" id="cartIcon">
                    🛒 سبد خرید 
                    <span id="cartCount" class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container product-detail-page">
        <div id="productDetailContainer">
            <div style="text-align: center; padding: 50px;">در حال بارگذاری...</div>
        </div>
        <div class="back-button">
            <button onclick="window.location.href='index.html'">← بازگشت به فروشگاه</button>
        </div>
    </main>

    <!-- سبد خرید سایدبار -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3 class="cart-title">🛒 سبد خرید شما</h3>
            <button class="close-cart" id="closeCartButton">✕</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <strong>تعداد کل: <span id="totalItems">0</span> محصول</strong>
            </div>
            <button class="checkout-btn" id="checkoutButton">📦 ثبت سفارش</button>
        </div>
    </div>
    <div id="cartOverlay" class="cart-overlay"></div>

    <script>
        function displayProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            
            if (!products || products.length === 0) {
                document.getElementById('productDetailContainer').innerHTML = '<div style="text-align:center;padding:50px;">خطا در بارگذاری محصولات</div>';
                return;
            }
            
            const product = products.find(p => p.id === productId);
            const container = document.getElementById('productDetailContainer');
            
            if (!product) {
                container.innerHTML = `
                    <div style="text-align:center;padding:50px;">
                        <h2>محصول یافت نشد</h2>
                        <button onclick="window.location.href='index.html'" style="background:var(--primary);color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;">بازگشت به فروشگاه</button>
                    </div>
                `;
                return;
            }
            
            const displayPrice = product.priceText || product.price;
            const brandName = product.brand || (product.description ? product.description.split('|')[0]?.trim() : 'PulseGadgett');
            
            container.innerHTML = `
                <div class="product-detail-container">
                    <div class="product-image-section">
                        <img src="${product.image || 'images/placeholder.jpg'}" alt="${product.name}" class="product-image-main" id="mainProductImage"
                             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDQwMCA0MDAiIGZpbGw9Im5vbmUiPjxyZWN0IHdpZHRoPSI0MDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjRjNGM0YzIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiM5OTkiIHRleHQtYW5jaG9yPSJtaWRkbGUiPtio2YrYstmF2YbbjCDYp9mG2K8iLz48L3N2Zz4='">
                    </div>
                    <div class="product-info-section">
                        <h1 class="product-title-detail">${product.name}</h1>
                        <div class="product-brand">${brandName}</div>
                        <div class="product-code-detail">کد محصول: ${product.code}</div>
                        <div class="product-category-detail" style="color:var(--secondary);">دسته: ${product.category}</div>
                        <div class="product-price-detail">${displayPrice}</div>
                        <div class="product-description-detail">${product.description || 'توضیحاتی برای این محصول موجود نیست.'}</div>
                        <button class="add-to-cart-detail" id="detailAddToCart" data-id="${product.id}">
                            🛒 افزودن به سبد خرید
                        </button>
                    </div>
                </div>
            `;
            
            document.title = `${product.name} - PulseGadgett`;
            
            const addBtn = document.getElementById('detailAddToCart');
            if (addBtn) {
                addBtn.addEventListener('click', function() {
                    if (typeof addToCart === 'function') {
                        addToCart(product.id);
                    } else {
                        alert('خطا: تابع افزودن به سبد خرید یافت نشد');
                    }
                });
            }
            
            const mainImage = document.getElementById('mainProductImage');
            if (mainImage) {
                mainImage.addEventListener('click', function() {
                    window.open(this.src, '_blank');
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            displayProductDetail();
            
            if (typeof updateCartDisplay === 'function') updateCartDisplay();
            
            const cartIcon = document.getElementById('cartIcon');
            const closeCartButton = document.getElementById('closeCartButton');
            const checkoutButton = document.getElementById('checkoutButton');
            const cartOverlay = document.getElementById('cartOverlay');
            
            if (cartIcon && typeof toggleCart === 'function') cartIcon.addEventListener('click', toggleCart);
            if (closeCartButton && typeof toggleCart === 'function') closeCartButton.addEventListener('click', toggleCart);
            if (checkoutButton && typeof checkout === 'function') checkoutButton.addEventListener('click', checkout);
            if (cartOverlay && typeof toggleCart === 'function') cartOverlay.addEventListener('click', toggleCart);
        });
    </script>
    <script src="common.js"></script>
</body>
</html>
